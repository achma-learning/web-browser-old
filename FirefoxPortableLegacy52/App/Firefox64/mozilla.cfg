// mozilla.cfg - hardening for the frozen Firefox 52.9.0 ESR build. The first line must stay a comment.
// Loaded by defaults/pref/autoconfig.js. The same file lives in App/Firefox and App/Firefox64.
// lockPref    = cannot be changed in about:config.
// defaultPref = new default; a user can still change it in about:config.

// Keep this browser on 52.9.0. An update would replace it with a newer ESR
// and disable every legacy (XUL) add-on, which defeats the point of this package.
lockPref("app.update.enabled", false);
lockPref("app.update.auto", false);
lockPref("app.update.service.enabled", false);   // no Mozilla Maintenance Service on the host PC
lockPref("app.update.staging.enabled", false);

// Telemetry, studies and self-repair: off. Their 2018-era endpoints are dead or unsupported.
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("toolkit.telemetry.archive.enabled", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("experiments.enabled", false);
defaultPref("network.allow-experiments", false);
defaultPref("browser.selfsupport.url", "");

// Dead services: Pocket (shut down) and the new-tab "tiles" feed.
defaultPref("extensions.pocket.enabled", false);
defaultPref("browser.newtabpage.enhanced", false);
defaultPref("browser.newtabpage.directory.source", "");
defaultPref("browser.newtabpage.directory.ping", "");

// Phishing / leak hardening that an old engine no longer gets from patches.
defaultPref("network.IDN_show_punycode", true);                    // show xn-- for look-alike domains
defaultPref("media.peerconnection.ice.default_address_only", true); // WebRTC: don't expose local IPs
