// mozilla.cfg - hardening for the frozen Firefox 52.9.0 ESR build. The first line must stay a comment.
// Loaded by defaults/pref/autoconfig.js. The same file lives in App/Firefox and App/Firefox64.
// lockPref    = cannot be changed in about:config.
// defaultPref = new default; a user can still change it in about:config.
// Goal: the original 52.9.0 engine (no patches since 2018), made as safe as prefs allow for internet use.

// --- Stay on 52.9.0 -----------------------------------------------------------
// An update would replace this build with a newer ESR. Updates are locked off.
lockPref("app.update.enabled", false);
lockPref("app.update.auto", false);
lockPref("app.update.service.enabled", false);   // no Mozilla Maintenance Service on the host PC
lockPref("app.update.staging.enabled", false);

// --- HTTPS: modern protocols and ciphers only ----------------------------------
defaultPref("security.tls.version.min", 3);                       // TLS 1.2+ (stock: 1 = TLS 1.0)
defaultPref("security.ssl3.rsa_des_ede3_sha", false);             // 3DES (Sweet32)
defaultPref("security.ssl3.dhe_rsa_aes_128_sha", false);          // weak/Logjam-era DHE
defaultPref("security.ssl3.dhe_rsa_aes_256_sha", false);
defaultPref("security.ssl.treat_unsafe_negotiation_as_broken", true);
defaultPref("security.mixed_content.block_display_content", true); // no http images/media on https pages
defaultPref("security.enterprise_roots.enabled", true);           // also trust CAs in the Windows store (2018 CA list is stale)

// --- Smaller attack surface (an unpatched engine is exploited mostly via these) --
defaultPref("plugin.default.state", 0);          // NPAPI plugins (Java, Silverlight...) never run
defaultPref("plugin.state.flash", 0);            // Flash never runs
defaultPref("webgl.disabled", true);             // GPU/driver attack surface
defaultPref("javascript.options.wasm", false);
defaultPref("javascript.options.asmjs", false);
defaultPref("media.eme.enabled", false);         // DRM: the 2018 Widevine CDM is outdated
defaultPref("media.gmp-widevinecdm.enabled", false);

// --- Tracking and privacy -------------------------------------------------------
defaultPref("privacy.trackingprotection.enabled", true);  // also blocks many ad/malvertising scripts
defaultPref("network.cookie.cookieBehavior", 1);          // block third-party cookies
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.IDN_show_punycode", true);                    // show xn-- for look-alike domains
defaultPref("media.peerconnection.ice.default_address_only", true); // WebRTC: don't expose local IPs

// --- Telemetry, studies and dead 2018 services: off ------------------------------
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("toolkit.telemetry.archive.enabled", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("experiments.enabled", false);
defaultPref("network.allow-experiments", false);
defaultPref("browser.selfsupport.url", "");
defaultPref("extensions.pocket.enabled", false);
defaultPref("browser.newtabpage.enhanced", false);
defaultPref("browser.newtabpage.directory.source", "");
defaultPref("browser.newtabpage.directory.ping", "");
