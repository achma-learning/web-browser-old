[FirefoxPortable]
FirefoxDirectory=App\firefox
ProfileDirectory=Data\profile
SettingsDirectory=Data\settings
PluginsDirectory=Data\plugins
FirefoxExecutable=firefox.exe
AdditionalParameters=
LocalHomepage=
DisableSplashScreen=false
AllowMultipleInstances=false
DisableIntelligentStart=false
SkipCompregFix=false
RunLocally=false
AlwaysUse32Bit=true

# The above options are explained in the included readme.txt
# THIS copy is ACTIVE: it sits next to FirefoxPortable.exe, so the launcher reads it on every start.
# AlwaysUse32Bit=true (readme default is false): 32-bit ESR 52 is the build that still loads legacy NPAPI plugins such as Java.
# The untouched example lives in Other\Source\FirefoxPortable.ini.
